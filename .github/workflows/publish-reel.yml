# Publishes a listening reel (a short render of daw's own synthesis, CC0) as a release asset.
#
# Reels are rendered by daw on a developer's machine; they are not built here and no audio is
# ever committed. The file arrives base64-encoded in workflow_dispatch inputs, split into parts
# because a dispatch's inputs are capped at 64 KB. Dispatch the parts one at a time, in order,
# each after the previous run has finished:
#
#   tag    release tag, e.g. kit-808-synth-2026-09-30 (created on the first part)
#   file   asset name, e.g. synth808-demo.mp3
#   sha256 of the whole file
#   part / parts   1-based part number and the total
#   data   base64 of this part (at most ~60 000 characters)
#   notes  release notes (markdown), used on the first part
#
# Each run uploads its part as `<file>.part-NN`. The run that completes the set downloads the
# parts, joins them, checks the sha256, uploads `<file>` and deletes the parts.
name: publish-reel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. kit-808-synth-2026-09-30)"
        required: true
      file:
        description: "Asset name (e.g. synth808-demo.mp3)"
        required: true
      sha256:
        description: "sha256 of the whole file"
        required: true
      part:
        description: "This part (1-based)"
        required: true
      parts:
        description: "Number of parts"
        required: true
      data:
        description: "base64 of this part"
        required: true
      notes:
        description: "Release notes (first part only)"
        required: false

concurrency:
  group: publish-reel-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      FILE: ${{ inputs.file }}
      SHA: ${{ inputs.sha256 }}
      PART: ${{ inputs.part }}
      PARTS: ${{ inputs.parts }}
      DATA: ${{ inputs.data }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$TAG" =~ ^[a-z0-9][a-z0-9.-]{0,79}$ ]] || { echo "bad tag"; exit 1; }
          [[ "$FILE" =~ ^[a-z0-9][a-z0-9._-]{0,79}\.(mp3|ogg|flac|wav|opus)$ ]] || { echo "bad file name"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha256"; exit 1; }
          [[ "$PART" =~ ^[0-9]{1,2}$ && "$PARTS" =~ ^[0-9]{1,2}$ ]] || { echo "bad part numbers"; exit 1; }
          (( PART >= 1 && PART <= PARTS && PARTS <= 40 )) || { echo "part out of range"; exit 1; }
      - name: Decode this part
        run: |
          mkdir out
          printf '%s' "$DATA" | base64 -d > "out/$FILE.part-$(printf %02d "$PART")"
          ls -l out
          sha256sum out/*
      - name: Create the release if needed and upload the part
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' "${NOTES:-Listening reel rendered by daw.}" > notes.md
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          elif [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" out/* --clobber
      - name: Join the parts when all are there
        run: |
          have=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep -c "^$FILE\.part-" || true)
          echo "parts uploaded: $have of $PARTS"
          [ "$have" -eq "$PARTS" ] || exit 0
          mkdir parts
          gh release download "$TAG" --pattern "$FILE.part-*" --dir parts
          cat $(ls parts/"$FILE".part-* | sort) > "$FILE"
          echo "$SHA  $FILE" | sha256sum -c -
          gh release upload "$TAG" "$FILE" --clobber
          for p in $(cd parts && ls); do gh release delete-asset "$TAG" "$p" --yes; done
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name) \(.size)"'
