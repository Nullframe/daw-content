# Builds the real-rooms IR pack (recorded impulse responses of real spaces for daw's
# convolution@1) from the upstream sources pinned in packs/real-rooms/recipes.json.
#
# - Pull request touching packs/real-rooms/: build and keep the result as a workflow
#   artifact, no release.
# - Manual run (workflow_dispatch) or a pushed tag `real-rooms-*`: build, then create or update
#   the release `real-rooms-<UTC date>` (or the pushed tag / the `tag` input) with every WAV,
#   SHA256SUMS, NOTICES.md, provenance.json, measurements.json and the daw manifest.
#
# Audio lives only in releases; the repository holds the recipe and scripts.
name: build-real-rooms

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: real-rooms-<UTC date>)"
        required: false
  push:
    tags: ["real-rooms-*"]
  pull_request:
    paths: ["packs/real-rooms/**", ".github/workflows/build-real-rooms.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pinned, so the conditioning is byte-reproducible)
        run: pip install numpy==2.4.6 scipy==1.17.1 soundfile==0.14.0
      - name: Tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then tag="${GITHUB_REF_NAME}";
          elif [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG";
          else tag="real-rooms-$(date -u +%Y-%m-%d)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd packs/real-rooms
          python3 build.py "$GITHUB_WORKSPACE/out" --cache "$RUNNER_TEMP/cache"
          python3 notices.py "$GITHUB_WORKSPACE/out"
          python3 manifest.py "$GITHUB_WORKSPACE/out" "$TAG" > "$GITHUB_WORKSPACE/out/real-rooms.json"
          rm -rf "$GITHUB_WORKSPACE/out/.cache"
          cd "$GITHUB_WORKSPACE/out" && sha256sum -c SHA256SUMS && ls -la && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: real-rooms
          path: out/
      - name: Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > notes.md <<NOTES
          Real rooms IR pack for daw's convolution@1: $(ls out/*.wav | wc -l) recorded impulse responses of real spaces (48 kHz, 24-bit WAV).
          Licences: CC BY 4.0, CC BY 3.0 and MIT (attribution in NOTICES.md; per-file source URL and licence in provenance.json).
          Built by .github/workflows/build-real-rooms.yml from packs/real-rooms at ${GITHUB_SHA}.
          Install in daw: \`daw library install real-rooms\` (downloads and verifies every file against SHA256SUMS pinned in daw).
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" out/* --title "Real rooms IR pack $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name) \(.size)"'
    permissions:
      contents: write
